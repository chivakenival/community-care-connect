  <meta charset="UTF-8">

  <meta

  <title>Dubuque Childcare Connect</title>

  <style>
    :root {
      --teal: #0f766e;
      --dark: #115e59;
      --cyan: #155e75;
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-weight: 800;
      font-size: 20px;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      display: inline-block;
      background: var(--teal);
      color: #ffffff;
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
    }

    .btn:hover {
      background: var(--dark);
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(15, 118, 110, 0.2);
    }

    .banner {
      width: 100%;
      height: 300px;
      overflow: hidden;
      background: #ffffff;
    }

    .banner img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .intro {
      max-width: 1180px;
      margin: 0 auto;
      padding: 26px 20px 0;
    }
